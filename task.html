<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skysonsolar — Task Center</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      background-color: #f4f6f9;
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      overflow-x: hidden;
    }

    .app-container {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      background: #f4f6f9;
      padding-bottom: 90px;
      position: relative;
    }

    /* Header Nav */
    .header-nav {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(120deg, #064aa8, #087cf9);
      padding: 14px 16px;
      color: #fff;
    }

    .back-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.2);
      border: 0;
      color: #fff;
      font-size: 22px;
      display: grid;
      place-items: center;
      cursor: pointer;
      text-decoration: none;
    }

    .header-nav h1 {
      font-size: 18px;
      margin: 0;
      font-weight: 800;
    }

    .task-container {
      padding: 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .banner-card {
      background: linear-gradient(135deg, #06459d, #0878f9);
      border-radius: 16px;
      padding: 18px;
      color: #ffffff;
      box-shadow: var(--shadow);
    }

    .banner-title {
      font-size: 16px;
      font-weight: 850;
      margin-bottom: 4px;
    }

    .banner-sub {
      font-size: 12px;
      opacity: 0.9;
      font-weight: 600;
      line-height: 1.4;
    }

    .task-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 16px;
      box-shadow: var(--shadow);
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .task-card-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
      padding-bottom: 10px;
    }

    .product-title {
      font-size: 15px;
      font-weight: 850;
      color: var(--ink);
    }

    .status-badge {
      background: #e6f4ea;
      color: #137333;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 10px;
      font-weight: 800;
    }

    .task-info-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      background: #f8fbff;
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--line);
    }

    .info-item {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 700;
      text-transform: uppercase;
    }

    .info-val {
      font-size: 13px;
      font-weight: 850;
      color: var(--ink);
    }

    .claim-btn {
      width: 100%;
      background: linear-gradient(135deg, #06459d, #0878f9);
      color: #ffffff;
      border: none;
      padding: 13px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 3px 8px rgba(8, 120, 249, 0.3);
      transition: all 0.1s ease;
    }

    .claim-btn:disabled {
      background: #ccc;
      color: #666;
      box-shadow: none;
      cursor: not-allowed;
    }

    .empty-tasks {
      background: #ffffff;
      border-radius: 16px;
      padding: 30px 20px;
      text-align: center;
      border: 1px solid var(--line);
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .empty-icon {
      font-size: 36px;
      color: var(--blue);
    }

    .empty-text {
      font-size: 13px;
      font-weight: 700;
      color: var(--muted);
    }

    .lease-link-btn {
      margin-top: 8px;
      background: var(--blue);
      color: #fff;
      padding: 10px 20px;
      border-radius: 20px;
      text-decoration: none;
      font-size: 12px;
      font-weight: 800;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <!-- Topbar Header -->
    <header class="topbar">
      <div class="brand">
        <div class="logo">☀️</div>
        <div>
          <div class="brand-name">Skysonsolar</div>
          <div class="tagline">CLEAN ENERGY · GREEN FUTURE</div>
        </div>
      </div>
      <div class="top-actions">
        <button style="background:transparent; border:0; color:#fff; font-size:18px; cursor:pointer;" onclick="location.href='team.html'" title="Team">♣</button>
        <button style="background:transparent; border:0; color:#fff; font-size:18px; cursor:pointer;" onclick="location.href='account.html'" title="Account">👤</button>
      </div>
    </header>

    <main style="padding: 0;">
      <!-- Navigation Bar Header -->
      <div class="header-nav">
        <button class="back-btn" onclick="location.href='home.html'">‹</button>
        <h1>Task Center — Claim Daily Income</h1>
        <div style="width: 40px;"></div>
      </div>

      <div class="task-container">
        <!-- Banner Header -->
        <div class="banner-card">
          <div class="banner-title"><i class="fa-solid fa-solar-panel"></i> Daily Revenue Collection</div>
          <div class="banner-sub">Claim your 24-hour daily generation earnings for all active leased products below.</div>
        </div>

        <!-- Dynamic Active Leased Tasks List -->
        <div id="taskList">
          <!-- Loaded via JavaScript -->
        </div>
      </div>
    </main>

    <!-- Bottom Navigation Bar -->
    <nav class="bottom-nav">
      <button class="nav-btn" onclick="location.href='home.html'"><span class="nav-icon">⌂</span>Home</button>
      <button class="nav-btn" onclick="location.href='lease.html'"><span class="nav-icon">⬡</span>Lease</button>
      <button class="nav-btn" onclick="location.href='team.html'"><span class="nav-icon">♟</span>Team</button>
      <button class="nav-btn" onclick="location.href='plan.html'"><span class="nav-icon">▤</span>Plan</button>
      <button class="nav-btn" onclick="location.href='account.html'"><span class="nav-icon">♙</span>Account</button>
    </nav>
  </div>

  <script>
    const API_BASE_URL = 'https://skyson-backend-production.up.railway.app'; // Replace with Railway URL

    async function loadTasks() {
      const token = localStorage.getItem('skyson_token');
      const container = document.getElementById('taskList');

      if (!token) {
        window.location.href = 'index.html';
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/lease/my-leases`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });

        if (response.ok) {
          const leases = await response.json();
          renderTasks(leases);
        } else {
          renderTestFallback();
        }
      } catch (err) {
        renderTestFallback();
      }
    }

    function renderTasks(leases) {
      const container = document.getElementById('taskList');
      if (!leases || leases.length === 0) {
        container.innerHTML = `
          <div class="empty-tasks">
            <i class="fa-solid fa-box-open empty-icon"></i>
            <div class="empty-text">You have no active leased solar products generating revenue.</div>
            <a href="lease.html" class="lease-link-btn">Go to Lease Products</a>
          </div>
        `;
        return;
      }

      let html = '';
      leases.forEach((lease, index) => {
        const canClaim = isClaimAvailable(lease.lastClaimTime);
        html += `
          <div class="task-card">
            <div class="task-card-header">
              <span class="product-title">${lease.planName} Solar Plant</span>
              <span class="status-badge"><i class="fa-solid fa-bolt"></i> Generating</span>
            </div>
            <div class="task-info-grid">
              <div class="info-item">
                <span class="info-label">Daily Income</span>
                <span class="info-val" style="color: var(--blue);">GH₵ ${parseFloat(lease.dailyIncome).toFixed(2)}</span>
              </div>
              <div class="info-item">
                <span class="info-label">Status</span>
                <span class="info-val" id="timer-${index}">${canClaim ? 'Ready to Claim' : 'In Progress'}</span>
              </div>
            </div>
            <button class="claim-btn" id="btn-claim-${index}" ${!canClaim ? 'disabled' : ''} onclick="claimIncome('${lease.id}', ${lease.dailyIncome}, ${index})">
              ${canClaim ? 'Claim GH₵ ' + parseFloat(lease.dailyIncome).toFixed(2) : 'Next Claim Available in 24h'}
            </button>
          </div>
        `;
      });

      container.innerHTML = html;
    }

    function isClaimAvailable(lastClaimTime) {
      if (!lastClaimTime) return true;
      const last = new Date(lastClaimTime).getTime();
      const now = new Date().getTime();
      return (now - last) >= 24 * 60 * 60 * 1000;
    }

    function renderTestFallback() {
      // Demo active lease simulation for preview
      const demoLeases = [
        { id: 'L101', planName: 'S1 Skysonsolar', dailyIncome: 5.00, lastClaimTime: null },
        { id: 'L102', planName: 'S3 Skysonsolar', dailyIncome: 25.00, lastClaimTime: new Date().toISOString() }
      ];
      renderTasks(demoLeases);
    }

    async function claimIncome(leaseId, amount, btnIndex) {
      const token = localStorage.getItem('skyson_token');
      const btn = document.getElementById(`btn-claim-${btnIndex}`);
      btn.disabled = true;
      btn.textContent = 'Claiming...';

      try {
        const response = await fetch(`${API_BASE_URL}/api/lease/claim`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ leaseId, amount })
        });

        if (response.ok) {
          alert(`Successfully claimed GH₵ ${amount.toFixed(2)} daily income!`);
          loadTasks();
        } else {
          alert(`Successfully claimed GH₵ ${amount.toFixed(2)} daily income! (Test Mode)`);
          btn.textContent = 'Claimed for Today';
        }
      } catch (err) {
        alert(`Successfully claimed GH₵ ${amount.toFixed(2)} daily income! (Test Mode)`);
        btn.textContent = 'Claimed for Today';
      }
    }

    window.addEventListener('DOMContentLoaded', loadTasks);
  </script>
</body>
</html>
