<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skysonsolar — Login</title>
<link rel="stylesheet" href="style.css">
<style>
.auth-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 22px;
  background: linear-gradient(145deg, #06459d, #0878f9 58%, #228eff);
}
.auth-card {
  width: min(440px, 100%);
  background: #fff;
  border-radius: 28px;
  padding: 32px 26px;
  box-shadow: 0 18px 55px rgba(3, 46, 106, 0.3);
  max-height: 92vh;
  overflow-y: auto;
}
.auth-brand {
  text-align: center;
  color: #0750b0;
  margin-bottom: 24px;
}
.auth-logo {
  font-size: 38px;
  width: 72px;
  height: 72px;
  margin: 0 auto 12px;
  border-radius: 20px;
  display: grid;
  place-items: center;
  color: #fff;
  background: linear-gradient(145deg, #ffc107, #ff9800);
  border: 3px solid #fff3cd;
  box-shadow: 0 4px 12px rgba(255, 193, 7, 0.3);
}
.auth-brand h1 {
  font-size: 26px;
  margin: 4px 0;
  font-weight: 850;
  color: #06459d;
}
.auth-brand p {
  font-size: 9px;
  letter-spacing: 2.5px;
  margin: 0;
  font-weight: 800;
  color: #6f87ac;
}
.auth-card h2 {
  margin: 0 0 14px;
  color: #103e83;
  font-size: 20px;
  font-weight: 800;
}
.auth-field {
  display: block;
  margin: 14px 0;
  color: #315b91;
  font-size: 12px;
  font-weight: 700;
}
.auth-field input {
  width: 100%;
  margin-top: 6px;
  padding: 13px 15px;
  border: 1px solid #d9eaff;
  border-radius: 12px;
  background: #fcfdff;
  outline-color: #0878f9;
  font-size: 14px;
  color: #103e83;
  font-weight: 600;
}
.auth-submit {
  width: 100%;
  margin-top: 16px;
  padding: 14px;
  font-size: 14px;
  border-radius: 14px;
  font-weight: 800;
}
.auth-toggle {
  border: 0;
  background: none;
  color: #0878f9;
  font-weight: 800;
  font-size: 13px;
  display: block;
  margin: 20px auto 0;
  cursor: pointer;
}
.auth-error {
  font-size: 12px;
  color: #d63838;
  margin-top: 8px;
  min-height: 16px;
  text-align: center;
  font-weight: 700;
}
</style>
</head>
<body>

<section class="auth-screen">
  <div class="auth-card">
    <div class="auth-brand">
      <div class="auth-logo">☀️</div>
      <h1>Skysonsolar</h1>
      <p>CLEAN ENERGY · GREEN FUTURE</p>
    </div>

    <!-- Login Panel -->
    <div id="loginPanel">
      <h2>Welcome back</h2>
      <label class="auth-field">Username or Email<input id="loginUsername" placeholder="Enter your username or email"></label>
      <label class="auth-field">Password<input id="loginPassword" type="password" placeholder="Enter your password"></label>
      <button class="btn auth-submit" onclick="loginUser()">Log In →</button>
      <div class="auth-error" id="authError"></div>
      <button class="auth-toggle" onclick="toggleAuth(true)">Register Now</button>
    </div>

    <!-- Signup Panel -->
    <div id="signupPanel" style="display:none">
      <h2>Create an account</h2>
      <label class="auth-field">Username<input id="signupUsername" placeholder="Choose a username"></label>
      <label class="auth-field">Email address<input id="signupEmail" type="email" placeholder="Enter your email address"></label>
      <label class="auth-field">Create password<input id="signupPassword" type="password" placeholder="At least 8 characters"></label>
      <label class="auth-field">Repeat password<input id="signupConfirmPassword" type="password" placeholder="Repeat password"></label>
      <label class="auth-field">Invitation Code (Required after first user)<input id="signupInvitationCode" placeholder="Enter valid invitation code"></label>
      <button class="btn auth-submit" onclick="signupUser()">Create Account →</button>
      <div class="auth-error" id="signupError"></div>
      <button class="auth-toggle" onclick="toggleAuth(false)">Back to Log In</button>
    </div>
  </div>
</section>

<script>
const API_URL = 'https://skyson-backend-production.up.railway.app'; // Live Railway backend URL

function toggleAuth(isSignup) {
  document.getElementById('loginPanel').style.display = isSignup ? 'none' : 'block';
  document.getElementById('signupPanel').style.display = isSignup ? 'block' : 'none';
  document.getElementById('authError').textContent = '';
  document.getElementById('signupError').textContent = '';
}

// Auto-populate invitation code if URL contains ?invite=CODE
window.addEventListener('DOMContentLoaded', () => {
  if (localStorage.getItem('skyson_token')) {
    window.location.href = 'home.html';
    return;
  }
  
  const urlParams = new URLSearchParams(window.location.search);
  const inviteCode = urlParams.get('invite');
  if (inviteCode) {
    document.getElementById('signupInvitationCode').value = inviteCode;
    toggleAuth(true);
  }
});

async function loginUser() {
  const username = document.getElementById('loginUsername').value.trim();
  const password = document.getElementById('loginPassword').value;
  const error = document.getElementById('authError');
  error.textContent = '';

  if(!username || !password) { error.textContent = 'Please fill in all fields.'; return; }

  try {
    const res = await fetch(`${API_URL}/api/auth/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await res.json();
    
    if(!res.ok) { 
      error.textContent = data.message || data.error || 'Login failed.'; 
      return; 
    }

    localStorage.setItem('skyson_token', data.token);
    localStorage.setItem('skyson_user', JSON.stringify(data.user));
    window.location.href = 'home.html';
  } catch(e) {
    error.textContent = 'Network error. Could not connect to server.';
  }
}

async function signupUser() {
  const username = document.getElementById('signupUsername').value.trim();
  const email = document.getElementById('signupEmail').value.trim();
  const password = document.getElementById('signupPassword').value;
  const confirmPassword = document.getElementById('signupConfirmPassword').value;
  const invitationCode = document.getElementById('signupInvitationCode').value.trim();
  const error = document.getElementById('signupError');
  error.textContent = '';

  if(!username || !email || !password || !confirmPassword) {
    error.textContent = 'Please fill in all required fields.';
    return;
  }

  if(password !== confirmPassword) { 
    error.textContent = 'Passwords do not match.'; 
    return; 
  }

  if(password.length < 8) {
    error.textContent = 'Password must be at least 8 characters.';
    return;
  }

  try {
    const res = await fetch(`${API_URL}/api/auth/register`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, email, password, invitationCode })
    });
    const data = await res.json();
    
    if(!res.ok) { 
      error.textContent = data.message || data.error || 'Registration failed.'; 
      return; 
    }

    localStorage.setItem('skyson_token', data.token);
    localStorage.setItem('skyson_user', JSON.stringify(data.user));
    window.location.href = 'home.html';
  } catch(e) {
    error.textContent = 'Network error. Could not connect to server.';
  }
}
</script>
</body>
</html>
