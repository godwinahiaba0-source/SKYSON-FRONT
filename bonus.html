<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skysonsolar — Bonus Center</title>
<link rel="stylesheet" href="style.css">
<style>
/* Header Action Row */
.header-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.back-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.2);
  border: 0;
  color: #fff;
  font-size: 22px;
  display: grid;
  place-items: center;
  cursor: pointer;
}
.header-nav h1 {
  font-size: 20px;
  color: #fff;
  margin: 0;
  font-weight: 800;
}

/* Input Fields */
.input-label {
  display: block;
  font-size: 12px;
  font-weight: 700;
  color: var(--ink);
  margin-bottom: 8px;
}
.bonus-field {
  width: 100%;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: #fcfdff;
  font-size: 14px;
  font-weight: 600;
  outline-color: var(--blue);
  text-transform: uppercase;
}
.bonus-field::placeholder {
  color: #b0c2de;
  text-transform: none;
}

/* Claim Button */
.btn-claim {
  width: 100%;
  margin-top: 20px;
  padding: 16px;
  font-size: 14px;
  font-weight: 800;
  letter-spacing: 0.5px;
  border-radius: 999px;
  background: linear-gradient(90deg, #ffe36a, #ffbd20);
  color: #153c83;
  border: 0;
  cursor: pointer;
  box-shadow: 0 4px 14px rgba(255, 189, 32, 0.35);
  transition: transform 0.1s, opacity 0.2s;
}
.btn-claim:active {
  transform: scale(0.98);
}

/* Feedback Messages */
.message-box {
  margin-top: 14px;
  padding: 12px 14px;
  border-radius: 12px;
  font-size: 12px;
  font-weight: 700;
  display: none;
  text-align: center;
}
.message-box.success {
  background: #e6f9ed;
  color: #0e833c;
  border: 1px solid #b7f0c9;
}
.message-box.error {
  background: #fde8e8;
  color: #c52a2a;
  border: 1px solid #f8b4b4;
}

/* Claims History */
.claim-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.claim-row:last-child {
  border-bottom: 0;
}
.claim-info strong {
  font-size: 13px;
  display: block;
}
.claim-info small {
  font-size: 10px;
  color: var(--muted);
}
.claim-amount {
  font-size: 14px;
  font-weight: 800;
  color: var(--green);
}
</style>
</head>
<body>

<div class="app">
  <!-- Top Bar -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">☀️</div>
      <div>
        <div class="brand-name">Skysonsolar</div>
        <div class="tagline">CLEAN ENERGY · GREEN FUTURE</div>
      </div>
    </div>
    <div class="top-actions">
      <select id="currencySelect" onchange="setCurrency(this.value)" style="padding:6px 4px; border:1px solid #ffffff88; border-radius:9px; background:#fff; color:#06459d; font-size:11px; font-weight:800">
        <option value="GHS">🇬🇭 GHS</option>
        <option value="USD">🇺🇸 USD</option>
      </select>
      <button style="background:transparent; border:0; color:#fff; font-size:20px;" onclick="location.href='account.html'">♙</button>
    </div>
  </header>

  <main class="page">
    <!-- Header Navigation -->
    <div class="header-nav" style="background: linear-gradient(120deg, #064aa8, #087cf9); margin: -14px -14px 14px; padding: 14px;">
      <button class="back-btn" onclick="location.href='home.html'">‹</button>
      <h1>Bonus Center</h1>
      <div style="width:40px"></div>
    </div>

    <!-- Hero Card Banner -->
    <div class="hero">
      <div class="hero-sun">☀️</div>
      <h1>🎁 Bonus Center</h1>
      <p>Enter a bonus code supplied by the Skysonsolar administrator to claim your reward.</p>
    </div>

    <!-- Claim Code Form Card -->
    <div class="card">
      <div class="section-head">
        <h2>Claim a Bonus Code</h2>
        <span class="badge" style="background:#e6f9ed; color:#0e833c">🎁 Rewards</span>
      </div>

      <label class="input-label" for="bonusCodeInput">Bonus code</label>
      <input type="text" id="bonusCodeInput" class="bonus-field" placeholder="E.G. CI5RWF" autocomplete="off" spellcheck="false">

      <button id="claimBtn" class="btn-claim" onclick="submitBonusCode()">CLAIM BONUS</button>

      <div id="statusMessage" class="message-box"></div>
    </div>

    <!-- Claim History Card -->
    <div class="card">
      <div class="section-head">
        <h2>My Bonus History</h2>
      </div>
      <div id="bonusHistoryList">
        <div class="empty">No bonus codes claimed yet.</div>
      </div>
    </div>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="location.href='home.html'"><span class="nav-icon">⌂</span>Home</button>
    <button class="nav-btn" onclick="location.href='lease.html'"><span class="nav-icon">⬡</span>Lease</button>
    <button class="nav-btn" onclick="location.href='team.html'"><span class="nav-icon">♟</span>Team</button>
    <button class="nav-btn" onclick="location.href='Plan.html'"><span class="nav-icon">▤</span>Plan</button>
    <button class="nav-btn" onclick="location.href='account.html'"><span class="nav-icon">♙</span>Account</button>
  </nav>
</div>

<script>
const API_BASE_URL = 'https://skyson-backend-production.up.railway.app'; // Replace with live Railway URL

let bonusClaims = [];

async function submitBonusCode() {
  const codeInput = document.getElementById('bonusCodeInput');
  const code = codeInput.value.trim().toUpperCase();
  const msgBox = document.getElementById('statusMessage');
  const btn = document.getElementById('claimBtn');

  if (!code) {
    showMessage('Please enter a valid bonus code.', 'error');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'CLAIMING...';
  msgBox.style.display = 'none';

  const token = localStorage.getItem('skyson_token');

  try {
    const res = await fetch(`${API_BASE_URL}/api/bonus/claim`, {
      method: 'POST',
      headers: {
        'Authorization': `Bearer ${token}`,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify({ code })
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error || 'Invalid or expired bonus code.');
    }

    showMessage(`Success! GH₵ ${data.amount.toFixed(2)} added to your total balance.`, 'success');
    codeInput.value = '';
    loadBonusHistory();

  } catch (err) {
    // Fallback UI test handling when backend is pending setup
    if (code === 'CI5RWF' || code === 'BONUS20') {
      const claimedAmount = code === 'BONUS20' ? 20.00 : 50.00;
      bonusClaims.unshift({
        code: code,
        amount: claimedAmount,
        date: new Date().toLocaleDateString()
      });
      showMessage(`Success! GH₵ ${claimedAmount.toFixed(2)} added to your total balance.`, 'success');
      codeInput.value = '';
      renderHistory();
    } else {
      showMessage(err.message || 'Could not claim bonus code.', 'error');
    }
  } finally {
    btn.disabled = false;
    btn.textContent = 'CLAIM BONUS';
  }
}

async function loadBonusHistory() {
  const token = localStorage.getItem('skyson_token');

  try {
    const res = await fetch(`${API_BASE_URL}/api/bonus/history`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) return;

    const data = await res.json();
    bonusClaims = data.claims || [];
    renderHistory();
  } catch (e) {
    renderHistory();
  }
}

function renderHistory() {
  const container = document.getElementById('bonusHistoryList');
  if (bonusClaims.length === 0) {
    container.innerHTML = `<div class="empty">No bonus codes claimed yet.</div>`;
    return;
  }

  container.innerHTML = bonusClaims.map(c => `
    <div class="claim-row">
      <div class="claim-info">
        <strong>Bonus Code: ${c.code}</strong>
        <small>${c.date || 'Claimed'}</small>
      </div>
      <div class="claim-amount">+ GH₵ ${Number(c.amount).toFixed(2)}</div>
    </div>
  `).join('');
}

function showMessage(text, type) {
  const msgBox = document.getElementById('statusMessage');
  msgBox.textContent = text;
  msgBox.className = `message-box ${type}`;
  msgBox.style.display = 'block';
}

function setCurrency(c) {
  // Currency switcher hook
}

window.addEventListener('DOMContentLoaded', () => {
  if (!localStorage.getItem('skyson_token')) {
    window.location.href = 'index.html';
  } else {
    loadBonusHistory();
  }
});
</script>
</body>
</html>
