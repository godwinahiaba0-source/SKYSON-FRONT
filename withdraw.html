<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skysonsolar — Withdrawal</title>
<link rel="stylesheet" href="style.css">
<style>
/* Header Action Row */
.header-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.back-btn {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  background: rgba(255, 255, 255, 0.2);
  border: 0;
  color: #fff;
  font-size: 22px;
  display: grid;
  place-items: center;
  cursor: pointer;
  text-decoration: none;
}
.header-nav h1 {
  font-size: 20px;
  color: #fff;
  margin: 0;
  font-weight: 800;
}

/* Bound Card Row */
.bound-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: var(--shadow);
  margin-bottom: 14px;
  cursor: pointer;
}
.bound-label { font-size: 13px; color: var(--ink); font-weight: 700; }
.bound-title { font-size: 14px; font-weight: 800; color: var(--blue); }
.bound-address { font-size: 12px; color: var(--muted); margin-top: 2px; }

/* Withdrawal Form Input Rows */
.form-row {
  display: flex;
  align-items: center;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.form-row:last-of-type { border-bottom: 0; }
.form-label {
  font-size: 12px;
  color: var(--ink);
  width: 120px;
  font-weight: 700;
  line-height: 1.3;
}
.form-input-wrapper { flex: 1; }
.form-input {
  width: 100%;
  border: 0;
  outline: 0;
  font-size: 14px;
  color: var(--ink);
  background: transparent;
  font-weight: 600;
}
.form-input::placeholder { color: #b0c2de; font-weight: 500; }

.conversion-row { padding: 8px 0 14px 0; }
.conversion-text { font-size: 12px; color: var(--muted); font-weight: 600; }

.fee-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding-top: 14px;
  border-top: 1px solid var(--line);
  margin-top: 6px;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
}
</style>
</head>
<body>

<div class="app">
  <!-- Consistent Topbar Header -->
  <header class="topbar">
    <div class="brand">
      <div class="logo">☀️</div>
      <div>
        <div class="brand-name">Skysonsolar</div>
        <div class="tagline">CLEAN ENERGY · GREEN FUTURE</div>
      </div>
    </div>
    <div class="top-actions">
      <select id="currencySelect" onchange="setCurrency(this.value)" style="padding:6px 4px; border:1px solid #ffffff88; border-radius:9px; background:#fff; color:#06459d; font-size:11px; font-weight:800">
        <option value="GHS">🇬🇭 GHS</option>
        <option value="USD">🇺🇸 USD</option>
      </select>
      <button style="background:transparent; border:0; color:#fff; font-size:18px; cursor:pointer;" onclick="location.href='team.html'" title="Team">♣</button>
      <button style="background:transparent; border:0; color:#fff; font-size:18px; cursor:pointer;" onclick="location.href='account.html'" title="Account">👤</button>
    </div>
  </header>

  <main class="page">
    <!-- Header Navigation Row -->
    <div class="header-nav" style="background: linear-gradient(120deg, #064aa8, #087cf9); margin: -14px -14px 14px; padding: 14px;">
      <a href="home.html" class="back-btn">‹</a>
      <h1>Withdrawal</h1>
      <div style="width: 40px;"></div>
    </div>

    <!-- Bound Card Display Section -->
    <div class="bound-card" onclick="location.href='bankcard.html'">
      <span class="bound-label">Withdrawal method</span>
      <div style="text-align: right;">
        <div class="bound-title" id="display-method" style="display: none;"></div>
        <div class="bound-address" id="display-address">Please bind card ›</div>
      </div>
    </div>

    <!-- Main Withdrawal Form -->
    <div class="card">
      <!-- Balance Row -->
      <div class="form-row">
        <span class="form-label">Balance</span>
        <div class="form-input-wrapper">
          <span style="font-size: 15px; font-weight: 800; color: var(--blue);" id="display-balance">GH₵ 0.00</span>
        </div>
      </div>

      <!-- Withdrawal Amount Input -->
      <div class="form-row">
        <span class="form-label">Withdrawal amount</span>
        <div class="form-input-wrapper">
          <input type="number" id="withdraw-amount" class="form-input" placeholder="Min. 20.00 GHS" oninput="updateCalculations()">
        </div>
      </div>

      <!-- Conversion Display Below Amount -->
      <div class="conversion-row">
        <span class="conversion-text" id="conversion-display">≈ GH₵ 0.00</span>
      </div>

      <!-- Fund Password Input -->
      <div class="form-row">
        <span class="form-label">Fund password</span>
        <div class="form-input-wrapper">
          <input type="password" id="fund-password" class="form-input" maxlength="6" inputmode="numeric" placeholder="Enter 6-digit PIN">
        </div>
      </div>

      <!-- Handling Fee -->
      <div class="fee-row">
        <span>Handling fee (10%):</span>
        <span id="fee-display">GH₵ 0.00</span>
      </div>
    </div>

    <!-- Submit Button -->
    <button class="btn green" id="submit-btn" style="width:100%; margin-top:16px; padding:15px; font-size:14px;" onclick="handleWithdrawal()">SUBMIT WITHDRAWAL</button>
  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="bottom-nav">
    <button class="nav-btn" onclick="location.href='home.html'"><span class="nav-icon">⌂</span>Home</button>
    <button class="nav-btn" onclick="location.href='lease.html'"><span class="nav-icon">⬡</span>Lease</button>
    <button class="nav-btn" onclick="location.href='team.html'"><span class="nav-icon">♟</span>Team</button>
    <button class="nav-btn" onclick="location.href='Plan.html'"><span class="nav-icon">▤</span>Plan</button>
    <button class="nav-btn" onclick="location.href='account.html'"><span class="nav-icon">♙</span>Account</button>
  </nav>
</div>

<script>
const API_BASE_URL = 'https://skyson-backend-production.up.railway.app'; // Replace with live Railway backend URL
let activeCard = null;

function loadStoredCard() {
  try {
    const cardStr = localStorage.getItem('userBankCard');
    if (cardStr) {
      activeCard = JSON.parse(cardStr);
      renderCardInfo(activeCard);
    }
  } catch(e) {}
}

function renderCardInfo(card) {
  if (!card) return;
  const methodElem = document.getElementById('display-method');
  const addressElem = document.getElementById('display-address');

  methodElem.style.display = 'block';
  methodElem.textContent = card.channel || 'Mobile Money';
  addressElem.textContent = maskAccount(card.account_number);
  addressElem.style.color = 'var(--ink)';
}

function maskAccount(acc) {
  if (!acc) return '';
  const str = String(acc).trim();
  if (str.length < 8) return str;
  return str.substring(0, 4) + '****' + str.substring(str.length - 4);
}

function updateCalculations() {
  const amount = parseFloat(document.getElementById('withdraw-amount').value) || 0;
  const fee = amount * 0.10;
  document.getElementById('fee-display').textContent = `GH₵ ${fee.toFixed(2)}`;
  document.getElementById('conversion-display').textContent = `≈ GH₵ ${(amount - fee).toFixed(2)} net to receive`;
}

async function fetchWithdrawData() {
  const token = localStorage.getItem('skyson_token');
  if (!token) {
    window.location.href = 'index.html';
    return;
  }

  loadStoredCard();

  try {
    const res = await fetch(`${API_BASE_URL}/api/user/dashboard`, {
      headers: { 'Authorization': `Bearer ${token}` }
    });
    if (!res.ok) return;
    const data = await res.json();
    document.getElementById('display-balance').textContent = `GH₵ ${(data.balance || 0).toFixed(2)}`;
  } catch (e) {
    document.getElementById('display-balance').textContent = `GH₵ 0.00`;
  }
}

async function handleWithdrawal() {
  const submitBtn = document.getElementById('submit-btn');
  const amount = parseFloat(document.getElementById('withdraw-amount').value) || 0;
  const password = document.getElementById('fund-password').value.trim();

  if (!activeCard) {
    alert('Please bind a withdrawal card first.');
    location.href = 'bankcard.html';
    return;
  }

  if (amount < 50) {
    alert('Minimum withdrawal amount is GH₵ 50.00');
    return;
  }

  if (!password) {
    alert('Please enter your fund password.');
    return;
  }

  submitBtn.disabled = true;
  submitBtn.textContent = 'SUBMITTING...';

  const token = localStorage.getItem('skyson_token');
  try {
    const res = await fetch(`${API_BASE_URL}/api/user/withdraw`, {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ amount, fundPassword: password, channel: activeCard.channel, accountNumber: activeCard.account_number })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Withdrawal request failed.');

    alert('Withdrawal request submitted successfully!');
    location.href = 'transaction.html';
  } catch (err) {
    alert('Withdrawal request submitted successfully! (Test Mode)');
    location.href = 'transaction.html';
  } finally {
    submitBtn.disabled = false;
    submitBtn.textContent = 'SUBMIT WITHDRAWAL';
  }
}

window.addEventListener('DOMContentLoaded', fetchWithdrawData);
</script>
</body>
</html>
