<script>
    const API_BASE_URL = 'https://skyson-backend-production.up.railway.app';

    // Fetch live user leases and disable buttons for already-owned plans
    async function fetchMyLeases() {
      const token = localStorage.getItem('skyson_token');
      if (!token) return;

      try {
        const res = await fetch(`${API_BASE_URL}/api/lease/my-leases`, {
          headers: { 'Authorization': `Bearer ${token}` }
        });
        const data = await res.json();
        const container = document.getElementById('myLeasesContainer');

        if (res.ok && data.leases && data.leases.length > 0) {
          // Disable buttons for plans already leased (Only for S1 to S3 since S4-S8 are permanently locked)
          data.leases.forEach(lease => {
            const btnId = `btn-${lease.plan_name}`;
            const btn = document.getElementById(btnId);
            if (btn && !btn.disabled) {
              btn.textContent = 'Already Leased / Active';
              btn.className = 'lease-btn disabled';
              btn.disabled = true;
            }
          });

          // Render active leases box with auto-crediting confirmation
          container.innerHTML = data.leases.map(lease => `
            <div class="active-lease-card">
              <div style="display: flex; justify-content: space-between; align-items: center;">
                <strong style="color: var(--blue); font-size: 14px;">${lease.plan_name}</strong>
                <span style="font-size: 11px; background: #e0f2fe; color: #0369a1; padding: 3px 8px; font-weight: 700; border-radius: 6px;">Active (${lease.duration} Days)</span>
              </div>
              <div style="display: flex; justify-content: space-between; font-size: 12px; color: var(--muted);">
                <span>Price Paid: <strong>GH₵ ${Number(lease.price).toFixed(2)}</strong></span>
                <span>Daily Payout: <strong style="color: #16a34a;">GH₵ ${Number(lease.daily_income).toFixed(2)} / 24h</strong></span>
              </div>
              <div style="font-size: 11px; color: #15803d; background: #dcfce7; padding: 8px; border-radius: 8px; text-align: center; font-weight: 700; margin-top: 4px;">
                ✓ Auto-crediting daily to your withdrawable balance.
              </div>
            </div>
          `).join('');
        } else {
          container.innerHTML = `
            <div style="background: #ffffff; border-radius: 16px; padding: 20px; text-align: center; color: var(--muted); font-size: 12px; font-weight: 600; border: 1px solid var(--line);">
              You have not started an active lease.
            </div>
          `;
        }
      } catch (err) {
        console.error('Error fetching leases:', err);
      }
    }

    async function submitLease(plan_name, price, daily_income, duration) {
      const token = localStorage.getItem('skyson_token');
      if (!token) {
        alert('Please log in first to lease a plan.');
        window.location.href = 'index.html';
        return;
      }

      if (!confirm(`Are you sure you want to lease ${plan_name} for GH₵ ${price.toFixed(2)}? This will be deducted from your deposit balance.`)) {
        return;
      }

      try {
        const response = await fetch(`${API_BASE_URL}/api/lease/buy`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ plan_name, price, daily_income, duration })
        });

        const data = await response.json();

        if (response.ok) {
          alert(data.message || `Successfully leased ${plan_name}!`);
          location.reload();
        } else {
          alert(data.message || 'Failed to process lease purchase.');
        }
      } catch (err) {
        console.error('Lease error:', err);
        alert('Network error connecting to server.');
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      if (!localStorage.getItem('skyson_token')) {
        window.location.href = 'index.html';
        return;
      }
      fetchMyLeases();
    });
  </script>
